name: Deploy to Firebase Hosting on PR
on:
  pull_request:
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Application
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://arearnzone.abdurrahman714915.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://uzmhfphwclvpwiiouqak.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_stzcP0VjBM_dL7LOsKTCLg_a2CFgbFy' }}
        run: npm run build

      - name: Deploy Preview to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AREARNZONE || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying preview using Service Account..."
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            npx firebase-tools hosting:channel:deploy pr-${{ github.event.pull_request.number }} --only hosting --project arearnzone --non-interactive
            rm -f service-account.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying preview using Firebase Token..."
            npx firebase-tools hosting:channel:deploy pr-${{ github.event.pull_request.number }} --only hosting --project arearnzone --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Warning: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set."
            echo "Skipping preview deployment."
          fi

