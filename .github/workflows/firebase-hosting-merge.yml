name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://arearnzone.abdurrahman714915.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://uzmhfphwclvpwiiouqak.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_stzcP0VjBM_dL7LOsKTCLg_a2CFgbFy' }}
        run: npm run build

      - name: Deploy Dual Hosting Targets to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AREARNZONE || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying dual hosting targets (arearnzone & arearnzone-asia-no1-freelance) via Service Account..."
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            npx firebase-tools deploy --only hosting --project arearnzone --non-interactive
            rm -f service-account.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying dual hosting targets via Firebase Token..."
            npx firebase-tools deploy --only hosting --project arearnzone --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Error: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set in GitHub Repository Secrets."
            echo "Please set FIREBASE_SERVICE_ACCOUNT in GitHub Repository Secrets."
            exit 1
          fi
