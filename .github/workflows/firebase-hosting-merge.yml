name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://arearnzone.abdurrahman714915.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://uzmhfphwclvpwiiouqak.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_stzcP0VjBM_dL7LOsKTCLg_a2CFgbFy' }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_AREARNZONE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AREARNZONE }}
          FIREBASE_SERVICE_ACCOUNT_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          SA_JSON="${FIREBASE_SERVICE_ACCOUNT_AREARNZONE:-$FIREBASE_SERVICE_ACCOUNT_DEFAULT}"
          if [ -n "$SA_JSON" ]; then
            echo "Deploying using Service Account..."
            printf '%s\n' "$SA_JSON" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            npx firebase-tools deploy --only hosting --project arearnzone --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying using Firebase Token..."
            npx firebase-tools deploy --only hosting --project arearnzone --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Error: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set in GitHub Secrets."
            echo "Please add FIREBASE_SERVICE_ACCOUNT to your GitHub Repository Secrets."
            exit 1
          fi

